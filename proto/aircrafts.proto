syntax = "proto3";

package targets;

option go_package = "./pb/aircraft";

enum Category{
    CATEGORY_UNKNOWN = 0;
    CATEGORY_FRIENDLY = 1;
    CATEGORY_HOSTILE = 2;
}

message Position{
        double lat = 1;
        double lng = 2;
        double alt = 3;
}

message AircraftIdentity {
    string callsign = 1;     
    int64 detection_time = 2; 
}

message AircraftUpdate {
    string callsign = 1;
    int64 detection_time = 2;

    int64 timestamp = 3;
    Position position = 4;
    double speed = 5;
    double heading = 6;

    Category category = 7;
    string mode_3a = 8;
    string classification = 9;
}
message GetHistoryRequest{
    AircraftIdentity aircraft = 1;

}


message GetHistoryResponse{
    repeated Position positions = 1;
}

// Luong stream

// ban tin NATS ban broadcast cho cac clients
message AircraftFrame{
    repeated AircraftUpdate data = 1;
    int64 frame_timestamp = 2;
}

message GetAircraftRequest{
    AircraftIdentity aircraft = 1;
}

message GetAircraftResponse{
    AircraftUpdate data = 1;
}


message GetArchivedHistoryRequest {
    int64 start_time = 1; 
    int64 end_time = 2;
}
message GetArchivedHistoryResponse{

}

UpdateIsPermanentAircraftsRequest{

}

UpdateIsPermanentAircraftsResponse {
    
}


message DeleteAircraftsRequest{
    repeated AircraftIdentity aircrafts = 1;
}

message DeleteAircraftsResponse{
    bool deleted = 1;
}

service AircraftServices{
    rpc GetAircraft(GetAircraftRequest) returns (GetAircraftResponse); //  lay thong tin 1 may bay
    rpc GetHistory(GetHistoryRequest)   returns (GetHistoryResponse); // lay lich su quy dao 1 may bay

    // get all information from all targets trong 1 khoang thoi gian de phat lai dong
    rpc GetArchivedHistory(GetArchivedHistoryRequest)   returns (GetArchivedHistoryResponse);

    rpc UpdateIsPermanentAircrafts(UpdateIsPermanentAircraftsRequest) returns (UpdateIsPermanentAircraftsResponse);

    rpc DeleteAircrafts(DeleteAircraftsRequest)  returns (DeleteAircraftsResponse); // xoa cold data (clients call this function)
    
}




