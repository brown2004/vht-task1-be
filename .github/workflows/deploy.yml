name: Deploy Backend Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      
      - name: build backend
        run: go build -o flightsim-be ./cmd/main.go

      - name: Package to Debian (.deb)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          nfpm package --packager deb --target flightsim-be.deb
        
      - name: Copy .deb to VPS
        uses: appleboy/scp-action@master
        with: 
          host: ${{ secrets.VPS_IP }}
          username: root
          key: $ {{ secrets.VPS_SSH_KEY }}
          source: "flightsm-be.deb"
          target: "/tmp/"

      - name: Install and restart service on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_KEY }}
          script: 
            dpkg -i /tmp/flightsim-be.deb
            systemctl deamon-reload
            systemctl enable flightsim-be
            systemctl restart flightsim-be



